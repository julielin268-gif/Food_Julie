<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推薦私房美食 | Foodie Map</title>
  <style>
    :root {
      --bg-color: #141113;
      --surface-color: #1e181c;
      --surface-card: #282025;
      --surface-hover: #342a30;
      --primary-color: #d35400;
      --primary-hover: #e67e22;
      --primary-light: #f39c12;
      --text-main: #f5f2f4;
      --text-muted: #b3a7b0;
      --border-color: #3e2e37;
      --max-width: 1100px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    header {
      background-color: rgba(20, 17, 19, 0.95);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .logo span { color: var(--primary-light); }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-links a {
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-links a.active {
      color: var(--text-main);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 4px;
    }

    .contact-wrapper {
      max-width: 700px;
      margin: 4rem auto;
      background-color: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem;
    }

    .contact-wrapper h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .contact-wrapper p {
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem 1rem;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-light);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--primary-color);
      color: var(--text-main);
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .success-message {
      display: none;
      background-color: rgba(46, 204, 113, 0.15);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 1rem;
      border-radius: 6px;
      text-align: center;
      margin-top: 1.5rem;
    }

    footer {
      background-color: #0d0a0c;
      padding: 2.5rem 0;
      margin-top: auto;
      border-top: 1px solid var(--border-color);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <a href="index.html" class="logo">Foodie <span>Map</span></a>
        <ul class="nav-links">
          <li><a href="index.html">首頁</a></li>
          <li><a href="courses.html">美食地圖</a></li>
          <li><a href="contact.html" class="active">推薦私房美食</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="contact-wrapper">
      <h1>推薦私房美食口袋名單</h1>
      <p>你有隱藏版的美食小吃或真心推薦的優質餐廳嗎？歡迎填表告訴我們！</p>

      <form id="recommend-form">
        <div class="form-group">
          <label for="name">您的暱稱 / 饕客代號</label>
          <input type="text" id="name" class="form-control" placeholder="例：大安區吃貨" required>
        </div>

        <div class="form-group">
          <label for="email">電子郵件 (選填，方便我們通知採納結果)</label>
          <input type="email" id="email" class="form-control" placeholder="example@email.com">
        </div>

        <div class="form-group">
          <label for="shop-name">推薦店家名稱與地點</label>
          <input type="text" id="shop-name" class="form-control" placeholder="例：阿財牛肉湯 (捷運西門站 3號出口)" required>
        </div>

        <div class="form-group">
          <label for="recommend-reason">必點招牌美食與推薦理由</label>
          <textarea id="recommend-reason" class="form-control" placeholder="請分享你的必點菜色與食記體驗..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">送出推薦名單</button>
      </form>

      <div class="success-message" id="success-message">
        🎉 感謝你的推薦！編輯團隊將會列入採訪與試吃名單中。
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 美食地圖 Foodie Map | 城市美食導覽</p>
    </div>
  </footer>

  <script>
    document.getElementById('recommend-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('success-message').style.display = 'block';
      this.reset();
    });
  </script>
</body>
</html>
